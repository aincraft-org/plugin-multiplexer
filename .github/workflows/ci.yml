name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    name: Gradle quality and artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run quality gate
        run: ./gradlew clean check

      - name: Package artifacts
        run: ./gradlew assemble

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-multiplexer-${{ github.sha }}
          if-no-files-found: error
          path: |
            network/build/libs/*.jar
            velocity-plugin/build/libs/*.jar

  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check Bash syntax
        run: bash -n bin/*.sh

      - name: Run ShellCheck
        run: shellcheck -x -P bin bin/*.sh

  upstream-skills:
    name: Upstream skill contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check out server-development-skills without nested submodules
        uses: actions/checkout@v7
        with:
          repository: aincraft-org/server-development-skills
          ref: 360a28e63c924a881cb9d6c22e66a2d910104f59
          path: .ci/server-development-skills
          submodules: false
          fetch-depth: 1

      - name: Verify upstream contracts
        run: |
          test -s .ci/server-development-skills/ci-release/SKILL.md
          test -s .ci/server-development-skills/project-setup/SKILL.md
